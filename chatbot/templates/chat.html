<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!DOCTYPE html>
<html>
	<head>
		<title>Chatbot</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<link rel="icon" type="image/png" href="{{ url_for('static', filename='geneguard-logo-symbol.png') }}">
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
	</head>
	
	
	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight align-items-center w-100">
								<div class="img_cont">
									<img src="{{ url_for('static', filename='geneguard-logo-symbol.png') }}" class="rounded-circle user_img" style="background: rgba(0,0,0,0.55); padding: 5px; border: 1px solid rgba(56, 189, 248, 0.5);">
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>GeneGuard AI</span>
									<p>Medical Intelligence Assistant</p>
								</div>
								<div class="ml-auto">
									<a href="http://localhost:5173" target="_top" class="btn btn-sm btn-outline-info" style="border-radius: 10px; font-weight: 600; padding: 6px 14px; text-decoration: none; color: #fff; border-color: rgba(6, 182, 212, 0.6); background: rgba(6, 182, 212, 0.15);">
										<i class="fas fa-heartbeat mr-1"></i> GeneGuard
									</a>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body">
							
							
						</div>
						<div class="card-footer">
							<form id="messageArea" class="input-group">
                                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			$(document).ready(function() {
				$("#messageArea").on("submit", function(event) {
					const date = new Date();
					const hour = date.getHours();
					const minute = date.getMinutes();
					const str_time = hour+":"+minute;
					var rawText = $("#text").val();

					var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">'+ str_time + '</span></div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"></div></div>';
					
					$("#text").val("");
					$("#messageFormeight").append(userHtml);

					var loadingHtml = '<div id="aiLoadingIndicator" class="d-flex justify-content-start mb-4 align-items-center"><div class="geneguard-loader-wrapper"><div class="loader"><div class="box"><div class="logo"><img src="{{ url_for(\'static\', filename=\'geneguard-logo-symbol.png\') }}" class="loader-logo-img"></div></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div></div><span style="color: #94a3b8; font-size: 0.8rem; margin-left: 14px;">GeneGuard AI researching...</span></div>';
					$("#messageFormeight").append(loadingHtml);
					var chatBox = document.getElementById("messageFormeight");
					if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

					$.ajax({
						data: {
							msg: rawText,	
						},
						type: "POST",
						url: "/get",
					}).done(function(data) {
						$("#aiLoadingIndicator").remove();
						var formatted = data;
						if (data && (data.indexOf('\n') !== -1 || data.trim().startsWith('•') || data.trim().startsWith('-'))) {
							var lines = data.split('\n');
							var listHtml = '<ul style="margin: 0; padding-left: 18px; list-style-type: disc;">';
							for (var i = 0; i < lines.length; i++) {
								var l = lines[i].trim();
								if (l) {
									l = l.replace(/^[\•\-\*]\s*/, '');
									listHtml += '<li style="margin-bottom: 5px; line-height: 1.45;">' + l + '</li>';
								}
							}
							listHtml += '</ul>';
							formatted = listHtml;
						}
						var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="{{ url_for(\'static\', filename=\'geneguard-logo-symbol.png\') }}" class="rounded-circle user_img_msg" style="background: rgba(0,0,0,0.5); padding: 3px; border: 1px solid rgba(56, 189, 248, 0.4);"></div><div class="msg_cotainer">' + formatted + '<span class="msg_time">' + str_time + '</span></div></div>';
						$("#messageFormeight").append($.parseHTML(botHtml));
						if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
					}).fail(function() {
						$("#aiLoadingIndicator").remove();
						var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="{{ url_for(\'static\', filename=\'geneguard-logo-symbol.png\') }}" class="rounded-circle user_img_msg" style="background: rgba(0,0,0,0.5); padding: 3px; border: 1px solid rgba(56, 189, 248, 0.4);"></div><div class="msg_cotainer" style="color: #f87171;">Connection error. Please try again.<span class="msg_time">' + str_time + '</span></div></div>';
						$("#messageFormeight").append($.parseHTML(botHtml));
						if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
					});
					event.preventDefault();
				});
			});
		</script>
        
    </body>
</html>
